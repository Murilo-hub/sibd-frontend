[build]
  base    = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy: redireciona chamadas /api/* para o backend no Render
[[redirects]]
  from   = "/api/*"
  to     = "https://sibd-backend-1.onrender.com"
  status = 200
  force  = true

# Redireciona todas as rotas do React Router para o index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
